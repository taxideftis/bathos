name: CI

on:
  push:
    branches: [develop, prod]
  pull_request:

# 동시 push 시 이전 실행 취소 (리소스 절약)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine (build · test · clippy · fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock', 'core/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Release build
        run: cargo build --release

      - name: Upload bathos binary
        uses: actions/upload-artifact@v4
        with:
          name: bathos-${{ runner.os }}
          path: core/target/release/bathos
          if-no-files-found: error

  hooks:
    name: Safety hooks (determinism harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build engine (hooks call the bathos binary)
        working-directory: core
        run: cargo build --release

      - name: Run hook determinism harness
        env:
          BATHOS_BIN: ${{ github.workspace }}/core/target/release/bathos
        run: bash .claude/hooks/_test-hooks.sh

      - name: Run Codex adapter hook harness (self-stubbed, no binary)
        run: bash codex-adapter/hooks/_test-codex-hooks.sh

      - name: Run Codex run-role.sh smoke test (T8, self-stubbed codex — story-18/SS12)
        run: bash codex-adapter/_test-run-role.sh

      - name: Check Codex emission drift (E-EMIT-DRIFT — story-18, script owned by Andrew)
        run: bash scripts/check-codex-drift.sh

  windows:
    name: Windows (engine build · test · PowerShell hook lint)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock', 'core/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test (Windows)
        working-directory: core
        run: cargo test --all

      - name: Release build (bathos.exe)
        working-directory: core
        run: cargo build --release

      - name: Upload bathos.exe
        uses: actions/upload-artifact@v4
        with:
          name: bathos-${{ runner.os }}
          path: core/target/release/bathos.exe
          if-no-files-found: error

      - name: PowerShell hook syntax lint (parse every .ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $total = 0
          Get-ChildItem -Path . -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '[\\/]core[\\/]target[\\/]' } |
            ForEach-Object {
              $tokens = $null; $perr = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$perr) | Out-Null
              if ($perr -and $perr.Count -gt 0) {
                Write-Host "PARSE ERROR  $($_.FullName)" -ForegroundColor Red
                $perr | ForEach-Object { Write-Host "    $($_.Extent.StartLineNumber): $($_.Message)" }
                $total += $perr.Count
              } else {
                Write-Host "ok  $($_.Name)"
              }
            }
          if ($total -gt 0) { throw "$total PowerShell parse error(s) found" }
          Write-Host "All .ps1 files parsed clean."

      - name: Run PowerShell hook harness (if present)
        shell: pwsh
        env:
          BATHOS_BIN: ${{ github.workspace }}/core/target/release/bathos.exe
        run: |
          if (Test-Path .claude/hooks/_test-hooks.ps1) {
            & .claude/hooks/_test-hooks.ps1
          } else {
            Write-Host "_test-hooks.ps1 not present yet - skipping harness (parse lint already ran)."
          }
