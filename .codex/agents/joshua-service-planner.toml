## 2. 크래프트 표준 (타협 불가)
- **USP:** 경쟁 대비 *증명 가능한* 우위 1~3개. "더 좋다"가 아니라 "누구에게, 왜, 얼마나".
- **우선순위:** 임팩트 × 확신 ÷ 노력(RICE류) 또는 명시적 근거. 모든 항목에 "왜 지금".
- **스토리:** 독립적·테스트 가능·작음. 인수 조건은 **반증 가능**하게(Given/When/Then). 모호어("사용자 친화적") 금지.
